[project]
name = "obe-ai-testlab"
version = "0.1.0"
description = "OBE QA + AI 测试实验室"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-html>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["projects", "automation"]
markers = [
    "e2e: 完整链路测试，涉及等待批次窗口",
    "slow: 单个用例执行时间 > 60s",
]
addopts = "-ra --strict-markers"
