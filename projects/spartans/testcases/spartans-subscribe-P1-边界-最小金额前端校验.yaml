id: spartans-subscribe-P1-boundary-min-amount-frontend-validation
title: 订阅最小金额应在前端拦截并给出明确提示
module: spartans / subscribe
priority: P1
type: 边界
preconditions:
  - 账号已登录
  - 可用余额 > <min_subscribe_amount_from_config>
data:
  bot_name: OBE-Jason
  below_min_amount: 0.0001
  min_amount: <min_subscribe_amount_from_config>
steps:
  - action: 打开机器人详情页并点击"订阅"
    path: /zh-cn/spartan-bot/{bot_name}
  - action: 在金额输入框输入 {below_min_amount}
  - action: 观察"确认"按钮状态
  - action: 若按钮可点击则尝试点击
expected:
  - 确认按钮应处于禁用状态（灰色不可点击）
  - 金额输入框下方出现明确提示："订阅金额不能低于 {min_amount} USDT"
  - 若按钮意外可点，提交后前端仍需拦截并展示错误提示（不允许 400 静默失败）
edge_cases:
  - 输入 0
  - 输入负数
  - 输入等于最小金额（应通过）
  - 输入 min_amount - 0.01（应拦截）
  - 输入包含前后空格的最小金额（应 trim 后通过）
notes:
  - 来源：Vegeta 走查发现 V3 - 最小金额只在后端校验，前端未拦截且 400 无提示
  - 前后端校验规则应一致，最小金额从同一配置源读取
